# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # Families whose sub-crates we also name directly, only to set features
    # on the umbrella's own copy (cubecl-common on wasm, malachite-nz for
    # serde). Bumped alone, a sub-crate becomes a second copy and the
    # umbrella loses those features, so each family moves as one PR.
    groups:
      cubecl:
        patterns:
          - "cubecl*"
      malachite:
        patterns:
          - "malachite*"
  - package-ecosystem: "rust-toolchain"
    directory: "/" # rust-toolchain.toml
    schedule:
      interval: "weekly"
