# Device parity tests for the GPU backends, on the devices hosted runners have.
#
# CI coverage by backend:
#   cubecl (wgpu)        — lavapipe via wgpu-Vulkan on Linux, and Metal on the
#                          macOS arm64 runner (Apple paravirtualized GPU)
#   cuda (hand-CUDA)     — NOT CI-testable: needs NVIDIA silicon. NVRTC
#                          compile-tests of every base's kernel do run in the
#                          normal suite when libnvrtc is present (in CI, the
#                          test-gpu-host job in rust-build-test.yml); result
#                          parity is validated manually on real hardware.
#   cubecl-cuda          — NOT CI-testable: needs NVIDIA silicon, same as cuda.
#   cubecl-spirv         — lavapipe on Linux (the direct SPIR-V compiler). Not
#                          on macOS: wgpu always selects Metal there, so the
#                          feature can't engage.
#   cubecl-metal         — Metal on the macOS arm64 runner (the direct MSL
#                          compiler; the one a Mac can actually use).
#
# Apple's GPU compiler miscompiles a constant division of a half-width shift,
# which the macOS runner's paravirtual GPU does not reproduce. The lavapipe
# job therefore also lints the WGSL of the kernels for that pattern
# (scripts/wgsl-lint.py).
name: GPU Device Parity

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always
    NICE_BUILD_SHA: ${{ github.sha }}
    RUST_BACKTRACE: 1

concurrency:
    group: gpu-parity-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lavapipe:
        name: cubecl on lavapipe (Linux)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Install lavapipe
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1 vulkan-tools

            - name: Run device parity tests
              # Point the loader at lavapipe explicitly so a future runner
              # image with a real ICD cannot change what this job tests.
              # (Ubuntu ships the ICD as `lvp_icd.json`, upstream Mesa as
              # `lvp_icd.<arch>.json` — glob both, and fail loudly if neither
              # exists rather than exporting an empty loader list.)
              run: |
                  export VK_ICD_FILENAMES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)"
                  test -n "$VK_ICD_FILENAMES" || { echo "no lavapipe ICD found"; exit 1; }
                  vulkaninfo --summary | grep -A3 deviceName || true
                  cargo test --release --features cubecl -p nice_common -- --ignored --nocapture

            - name: Lint the kernels' WGSL for Apple's half-shift division
              # Apple's GPU compiler gets a division or remainder by a constant
              # that is not a power of two wrong when the dividend is a right
              # shift by half the word (x >> 16, or a u64's high word), and no
              # runner here has that compiler. wgsl_dump_for_lint compiles the
              # browser kernel, the native detailed kernels and the stride and
              # join kernels at a few bases, CubeCL logs their WGSL, and the
              # script fails on the pattern; its header says what it cannot
              # see. Reuses the test binary the step above built.
              run: |
                  export VK_ICD_FILENAMES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)"
                  export CUBECL_DEBUG_LOG="$RUNNER_TEMP/wgsl.log"
                  cargo test --release --features cubecl -p nice_common --lib -- \
                      --ignored --exact cubecl_backend::tests::wgsl_dump_for_lint --nocapture
                  python3 scripts/wgsl-lint.py "$CUBECL_DEBUG_LOG" \
                      --require DetailedKernelU32@40 --require DetailedKernelU32@50 \
                      --require DetailedFdKernel@23 --require DetailedFdKernel@40 \
                      --require DetailedFdKernel@50 --require DetailedFdKernel@62 \
                      --require DetailedKernel@80 --require NiceonlyKernel@40 \
                      --require BucketKernel@57 --require JoinKernel@57 \
                      --require TopKernel@57 --require CheckKernel@57

            - name: Keep the WGSL the lint read
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: wgsl-lavapipe
                  path: ${{ runner.temp }}/wgsl.log
                  if-no-files-found: ignore

            - name: Run device parity tests (CubeCL direct SPIR-V compiler)
              # The `-gpu` docker image is built with cubecl-spirv, so its
              # Vulkan path is CubeCL's own SPIR-V codegen, not naga. Same
              # tests, second compiler. (The plane-scoped compaction variant
              # is skipped on llvmpipe by the test itself — see
              # is_software_rasterizer.)
              run: |
                  export VK_ICD_FILENAMES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)"
                  cargo test --release --features cubecl-spirv -p nice_common -- --ignored --nocapture cubecl_

    metal:
        name: cubecl (Metal) on macOS
        runs-on: macos-latest
        # A healthy run takes 9-16 minutes, build included. The MSL step has
        # occasionally hung with three tests stalled at once, and without a
        # limit it holds a macOS runner for GitHub's 6-hour maximum.
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v6

            - name: Run device parity tests
              # cubecl goes through wgpu -> Metal on the runner's
              # paravirtualized Apple GPU.
              run: |
                  cargo test --release --features cubecl -p nice_common -- --ignored --nocapture

            - name: Run device parity tests (CubeCL direct MSL compiler)
              # cubecl-metal is the direct compiler a Mac can actually use.
              # cubecl-spirv can't engage here (wgpu picks Metal), which is
              # why the Linux job tests spirv and this one tests msl.
              run: |
                  cargo test --release --features cubecl-metal -p nice_common -- --ignored --nocapture cubecl_
